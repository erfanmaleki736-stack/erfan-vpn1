<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M.r_MALEKI</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M.r_MALEKI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--pn:#151515;--k1:#272727;--k2:#191919;--fn:#7fe0cf;--onfn:#08211c;--op:#f2a33a;--eq:#ff6b4a;--tx:#f1f1f1;--mu:#9a9a9a;--lcd:#bccfa6;--lcdt:#18260f;--mono:ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f1f1f1;--pn:#fff;--k1:#fff;--k2:#e0e0e0;--fn:#0b6b5e;--onfn:#fff;--tx:#111;--mu:#5c5c5c;--lcd:#d7e3c8}
:root[data-theme="light"] .grid button{box-shadow:0 1px 3px #0003}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Vazirmatn,Tahoma,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:10px 12px 14px;min-height:100%;display:flex;flex-direction:column;gap:10px}
.plate{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--op);padding-bottom:6px}
.plate b{font:700 21px/1 var(--mono);direction:ltr}
.plate span{color:var(--mu);font-size:12px}
.plate button{border:1px solid var(--mu);background:transparent;color:var(--tx);border-radius:999px;font:inherit;font-size:12px;padding:2px 10px}
nav{display:flex;gap:6px}
nav button{flex:1;padding:7px 0;border:0;border-radius:8px;background:var(--k2);color:var(--mu);font:inherit;font-size:13px}
nav button.on{background:var(--fn);color:var(--onfn);font-weight:700}
.tab{display:none;flex-direction:column;gap:10px;flex:1}.tab.on{display:flex}
.lcd{background:var(--lcd);color:var(--lcdt);border-radius:10px;padding:8px 12px;box-shadow:inset 0 3px 8px #0006;direction:ltr;font-family:var(--mono)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.top button{border:1px solid #18260f66;background:transparent;color:inherit;border-radius:6px;font:700 12px var(--mono);padding:1px 8px}
.lcd input{width:100%;background:transparent;border:0;outline:0;color:inherit;font:inherit;font-size:22px;text-align:right;padding:4px 0}
.res{font-size:34px;font-weight:700;text-align:right;min-height:46px;overflow-x:auto;white-space:nowrap}
.grid{display:grid;gap:7px;direction:ltr}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.grid button{border:0;border-radius:10px;background:var(--k1);color:var(--tx);font:600 21px var(--mono);height:54px}
.g5 button{height:40px;font-size:14px;background:var(--k2);color:var(--fn)}
.grid button:active,.chips button:active{filter:brightness(1.35)}
.grid .o{background:var(--op);color:#2a1a02}.grid .eq{background:var(--eq);color:#fff}.grid .f{background:var(--k2);color:var(--fn)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--fn);outline-offset:2px}
.tg{align-self:flex-start;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:0}
textarea{width:100%;min-height:230px;direction:ltr;background:var(--pn);color:var(--tx);border:1px solid var(--k1);border-radius:10px;padding:10px;font:14px/1.5 var(--mono);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.chips button{border:0;border-radius:8px;background:var(--k2);color:var(--fn);font:12px var(--mono);padding:5px 9px}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:10px;background:var(--fn);color:var(--onfn);font:700 15px inherit;font-family:inherit;padding:10px 16px}
.btn.g{background:var(--k2);color:var(--tx);font-weight:400}
pre.out{margin:0;background:var(--pn);border-radius:10px;padding:10px;min-height:60px;direction:ltr;text-align:left;white-space:pre-wrap;font:13px/1.5 var(--mono);color:var(--fn)}
pre.out.err{color:var(--eq)}
canvas{display:none;width:100%;height:200px;border-radius:10px;background:var(--pn)}
select,.in{width:100%;background:var(--pn);color:var(--tx);border:1px solid var(--k1);border-radius:10px;padding:10px;font:16px var(--mono)}
.ur{font:700 28px var(--mono);direction:ltr;text-align:center;background:var(--lcd);color:var(--lcdt);border-radius:10px;padding:14px;overflow-x:auto}
.h{display:flex;justify-content:space-between;width:100%;direction:ltr;background:var(--pn);color:var(--tx);border:0;border-radius:10px;padding:10px 12px;font:15px var(--mono);margin-bottom:6px}
.h b{color:var(--op)}
.mu{color:var(--mu);text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="plate"><b>M.r_MALEKI</b><span>ماشین‌حساب مهندسی</span><button id="th">☀️ سفید</button></div>
  <nav>
    <button data-t="calc" class="on">محاسبه</button>
    <button data-t="code">کدنویسی</button>
    <button data-t="unit">واحدها</button>
    <button data-t="hist">تاریخچه</button>
  </nav>

  <section class="tab on" id="calc">
    <div class="lcd">
      <div class="top"><button id="mode">DEG</button><span id="ansv">Ans = 0</span></div>
      <input id="ex" inputmode="none" autocomplete="off" spellcheck="false" aria-label="عبارت">
      <div class="res" id="res">0</div>
    </div>
    <button class="tg" id="tg">توابع علمی (نمایش/پنهان)</button>
    <div class="grid g5" id="sci"></div>
    <div class="grid g4" id="keys"></div>
  </section>

  <section class="tab" id="code">
    <div class="chips" id="chips"></div>
    <textarea id="ta" spellcheck="false" aria-label="کد"></textarea>
    <div class="row"><button class="btn" id="run">اجرا ▶</button><button class="btn g" id="clr">پاک‌کردن</button></div>
    <pre class="out" id="out">خروجی اینجا نمایش داده می‌شود</pre>
    <canvas id="cv"></canvas>
    <div class="mu" style="font-size:12px">توابع: sin cos tan log ln sqrt pow abs … | solve integrate diff plot range sum ncr npr print | مقادیر PI و e</div>
  </section>

  <section class="tab" id="unit">
    <select id="uc"></select>
    <input class="in" id="uv" type="number" inputmode="decimal" value="1" aria-label="مقدار">
    <div class="row"><select id="ua"></select><select id="ub"></select></div>
    <div class="ur" id="ur">—</div>
  </section>

  <section class="tab" id="hist">
    <div id="hl"></div>
    <button class="btn g" id="hc">پاک‌کردن تاریخچه</button>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
let deg=true,ans=0,done=0,hist=[];
const inp=$('#ex'),res=$('#res');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
try{hist=JSON.parse(store.get('mrm_h')||'[]')}catch(e){hist=[]}
function theme(t){document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f1f1f1':'#0a0a0a';$('#th').textContent=t==='light'?'🌙 مشکی':'☀️ سفید'}
theme(store.get('mrm_t')==='light'?'light':'dark');
$('#th').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';store.set('mrm_t',t);theme(t)};

const fmt=n=>!isFinite(n)?(isNaN(n)?'خطا':n>0?'∞':'-∞'):Number.isInteger(n)&&Math.abs(n)<1e15?String(n):String(+n.toPrecision(12));
const fact=n=>{if(n<0||n%1)return NaN;if(n>170)return Infinity;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const ncr=(n,k)=>fact(n)/(fact(k)*fact(n-k)),npr=(n,k)=>fact(n)/fact(n-k);
const R=x=>deg?x*Math.PI/180:x,D=x=>deg?x*180/Math.PI:x;
const lib=()=>({sin:x=>Math.sin(R(x)),cos:x=>Math.cos(R(x)),tan:x=>Math.tan(R(x)),asin:x=>D(Math.asin(x)),acos:x=>D(Math.acos(x)),atan:x=>D(Math.atan(x)),
sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,log:Math.log10,ln:Math.log,log2:Math.log2,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp,pow:Math.pow,
floor:Math.floor,ceil:Math.ceil,round:Math.round,min:Math.min,max:Math.max,hypot:Math.hypot,sign:Math.sign,fact,ncr,npr,pi:Math.PI,PI:Math.PI,e:Math.E,Ans:ans});

function pre(s){return s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/π/g,'pi')
.replace(/√\s*(\d+\.?\d*|pi|e|Ans)/g,'sqrt($1)').replace(/√/g,'sqrt')
.replace(/(\d+\.?\d*)%/g,'($1/100)').replace(/(\d+\.?\d*)!/g,'fact($1)')
.replace(/\)(?=\s*[\dA-Za-z(])/g,')*')
.replace(/(?<![\w.])(\d+\.?\d*)(?=\s*(?!e[\d+\-])[A-Za-z(])/g,'$1*')}
function ev(s){const L=lib();return new Function(...Object.keys(L),'return ('+pre(s)+')')(...Object.values(L))}

/* ---------- keypad ---------- */
const sci=[['sin(','','sin'],['cos(','','cos'],['tan(','','tan'],['log(','','log'],['ln(','','ln'],
['asin(','','sin⁻¹'],['acos(','','cos⁻¹'],['atan(','','tan⁻¹'],['10^','','10ˣ'],['exp(','','eˣ'],
['√(','','√'],['^2','','x²'],['^','','xʸ'],['!','','n!'],['π','','π'],
['(','',''],[')','',''],['e','',''],['Ans','',''],['abs(','','|x|']];
const main=[['AC','f'],['⌫','f'],['%','f'],['÷','o'],['7',''],['8',''],['9',''],['×','o'],['4',''],['5',''],['6',''],['−','o'],['1',''],['2',''],['3',''],['+','o'],['±','f'],['0',''],['.',''],['=','eq']];
const mk=(el,a)=>{el.innerHTML=a.map(([v,c,l])=>`<button class="${c}" data-v="${v}">${l||v}</button>`).join('')};
mk($('#sci'),sci);mk($('#keys'),main);
$('#sci').onclick=$('#keys').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.v)};
$('#tg').onclick=()=>{const s=$('#sci');s.style.display=s.style.display==='none'?'':'none'};
$('#mode').onclick=e=>{deg=!deg;e.target.textContent=deg?'DEG':'RAD';upd()};

function key(v){
  const s=inp.value;
  if(v==='AC'){inp.value='';done=0;return upd()}
  if(v==='⌫'){if(done){inp.value='';done=0}else{const p=inp.selectionStart,m=s.slice(0,p).match(/([a-z]+\(|Ans|√\()$/),n=m?m[0].length:1;if(p>0)inp.setRangeText('',p-n,p,'end')}return upd()}
  if(v==='=')return calc();
  if(v==='±'){const m=s.match(/^-\((.*)\)$/);inp.value=m?m[1]:(s?'-('+s+')':'');done=0;return upd()}
  if(done){inp.value=/^[+−×÷^%!]/.test(v)?fmt(ans):'';done=0}
  inp.setRangeText(v,inp.selectionStart,inp.selectionEnd,'end');upd();
}
function upd(){
  $('#ansv').textContent='Ans = '+fmt(ans);res.style.opacity=.55;
  const s=inp.value;if(!s.trim()){res.textContent='0';return}
  try{const r=ev(s);res.textContent=typeof r==='number'?fmt(r):''}catch(e){res.textContent=''}
}
function calc(){
  const s=inp.value.trim();if(!s)return;
  try{const r=ev(s);if(typeof r!=='number'||isNaN(r))throw 0;
    ans=r;res.style.opacity=1;res.textContent=fmt(r);$('#ansv').textContent='Ans = '+fmt(r);
    hist.unshift([s,fmt(r)]);hist=hist.slice(0,60);store.set('mrm_h',JSON.stringify(hist));done=1;renderH()}
  catch(e){res.style.opacity=1;res.textContent='خطا'}
}
inp.oninput=()=>{done=0;upd()};
inp.onkeydown=e=>{if(e.key==='Enter')calc()};

/* ---------- history ---------- */
function renderH(){
  $('#hl').innerHTML=hist.length?hist.map((h,i)=>`<button class="h" data-i="${i}"><span>${h[0].replace(/</g,'&lt;')}</span><b>= ${h[1]}</b></button>`).join(''):'<div class="mu">هنوز محاسبه‌ای انجام نشده</div>';
}
$('#hl').onclick=e=>{const b=e.target.closest('button');if(!b)return;inp.value=hist[b.dataset.i][0];done=0;upd();tab('calc')};
$('#hc').onclick=()=>{hist=[];store.set('mrm_h','[]');renderH()};
renderH();

/* ---------- tabs ---------- */
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id===t));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t))}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)};

/* ---------- code ---------- */
const DEF=`// مثال: ریشه، انتگرال، مشتق و نمودار
const f = x => x**3 - 2*x - 5
print("ریشه:", solve(f, 2))
print("انتگرال sin از 0 تا PI:", integrate(Math.sin, 0, PI))
print("مشتق f در 1:", diff(f, 1))
plot(x => Math.sin(x) * x, -10, 10)`;
const ta=$('#ta');ta.value=store.get('mrm_code')||DEF;
const snip=['print()','solve(f, 1)','integrate(f, 0, 1)','diff(f, 1)','plot(f, -5, 5)','range(0, 10)','sum()','ncr(5, 2)','const f = x => '];
$('#chips').innerHTML=snip.map(s=>`<button data-s="${s}">${s.replace(/\(.*\)?$/,'')||s}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.s;ta.setRangeText(s,ta.selectionStart,ta.selectionEnd,'end');ta.focus()};
$('#clr').onclick=()=>{ta.value='';store.set('mrm_code','')};

function plot(f,a=-10,b=10){
  const c=$('#cv');c.style.display='block';
  const dpr=devicePixelRatio||1,w=c.clientWidth,h=200;c.width=w*dpr;c.height=h*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const st=getComputedStyle(document.documentElement),col=n=>st.getPropertyValue(n).trim();
  const N=300,xs=[],ys=[];let lo=1/0,hi=-1/0;
  for(let i=0;i<=N;i++){const t=a+(b-a)*i/N;let y;try{y=f(t)}catch(e){y=NaN}xs.push(t);ys.push(y);if(isFinite(y)){lo=Math.min(lo,y);hi=Math.max(hi,y)}}
  if(!isFinite(lo)){lo=-1;hi=1}if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const X=t=>(t-a)/(b-a)*(w-20)+10,Y=y=>h-10-(y-lo)/(hi-lo)*(h-20);
  x.strokeStyle=col('--mu');x.lineWidth=1;x.globalAlpha=.6;x.beginPath();
  if(lo<0&&hi>0){x.moveTo(10,Y(0));x.lineTo(w-10,Y(0))}
  if(a<0&&b>0){x.moveTo(X(0),10);x.lineTo(X(0),h-10)}
  x.stroke();x.globalAlpha=1;x.strokeStyle=col('--op');x.lineWidth=2;x.beginPath();let pen=false;
  ys.forEach((y,i)=>{if(!isFinite(y)){pen=false;return}pen?x.lineTo(X(xs[i]),Y(y)):x.moveTo(X(xs[i]),Y(y));pen=true});
  x.stroke();x.fillStyle=col('--mu');x.font='11px monospace';
  x.fillText(a,10,h-12);x.fillText(b,w-34,h-12);x.fillText(+hi.toPrecision(3),12,18);x.fillText(+lo.toPrecision(3),12,h-24);
}
$('#run').onclick=()=>{
  const code=ta.value;store.set('mrm_code',code);
  const out=[],o=$('#out');$('#cv').style.display='none';o.className='out';
  const s=v=>typeof v==='number'?fmt(v):typeof v==='object'?JSON.stringify(v):String(v);
  const L=lib();Object.assign(L,{sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,deg:x=>x*180/Math.PI,rad:x=>x*Math.PI/180});
  Object.assign(L,{
    print:(...a)=>out.push(a.map(s).join(' ')),
    range:(a,b,st=1)=>{const r=[];for(let v=a;st>0?v<=b+1e-12:v>=b-1e-12;v+=st)r.push(v);return r},
    sum:a=>a.reduce((p,c)=>p+c,0),
    diff:(f,v,h=1e-5)=>(f(v+h)-f(v-h))/(2*h),
    integrate:(f,a,b,n=1000)=>{if(n%2)n++;const h=(b-a)/n;let t=f(a)+f(b);for(let i=1;i<n;i++)t+=f(a+i*h)*(i%2?4:2);return t*h/3},
    solve:(f,v=1)=>{for(let i=0;i<100;i++){const d=(f(v+1e-7)-f(v-1e-7))/2e-7;if(!d)break;const n=v-f(v)/d;if(Math.abs(n-v)<1e-12)return n;v=n}return v},
    plot});
  const names=Object.keys(L),vals=Object.values(L);let r;
  try{
    try{r=new Function(...names,'return ('+code+'\n)')(...vals)}
    catch(e){if(!(e instanceof SyntaxError))throw e;r=new Function(...names,'{\n'+code+'\n}')(...vals)}
    if(r!==undefined&&typeof r!=='function')out.push('→ '+s(r));
    o.textContent=out.join('\n')||'انجام شد';
  }catch(e){o.className='out err';o.textContent=out.concat('خطا: '+e.message).join('\n')}
};

/* ---------- units ---------- */
const T='دما';
const U={'طول':{m:1,km:1e3,cm:.01,mm:.001,in:.0254,ft:.3048,mi:1609.344},'جرم':{kg:1,g:.001,lb:.45359237,oz:.028349523,ton:1000},
'فشار':{Pa:1,kPa:1e3,MPa:1e6,bar:1e5,psi:6894.757,atm:101325},'انرژی':{J:1,kJ:1e3,cal:4.184,kcal:4184,kWh:3.6e6,BTU:1055.056},
'توان':{W:1,kW:1e3,hp:745.7},'سرعت':{'m/s':1,'km/h':1/3.6,mph:.44704,kn:.514444},[T]:{'°C':1,'°F':1,K:1}};
const opt=a=>a.map(k=>`<option>${k}</option>`).join('');
$('#uc').innerHTML=opt(Object.keys(U));
function fillU(){const k=Object.keys(U[$('#uc').value]);$('#ua').innerHTML=opt(k);$('#ub').innerHTML=opt(k);$('#ub').selectedIndex=Math.min(1,k.length-1);conv()}
function conv(){
  const c=$('#uc').value,v=parseFloat($('#uv').value),a=$('#ua').value,b=$('#ub').value;let r;
  if(c===T){const C=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?C:b==='°F'?C*9/5+32:C+273.15}
  else r=v*U[c][a]/U[c][b];
  $('#ur').textContent=isNaN(r)?'—':fmt(r)+' '+b;
}
$('#uc').onchange=fillU;$('#ua').onchange=$('#ub').onchange=$('#uv').oninput=conv;
fillU();upd();
</script>
</body>
</html>
